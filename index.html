<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTS Planner | Driver Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --fleet-red: #e11d48; --fleet-amber: #f59e0b; --fleet-green: #10b981; --bg-main: #0f172a; --card-bg: #1e293b; --text-main: #f1f5f9; --border-color: #334155; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-main); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; font-size: 16px; margin: 0; }
        
        .glass-card { background: var(--card-bg); border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; }
        
        .planner-scroll { overflow: auto; flex-grow: 1; }
        .planner-scroll::-webkit-scrollbar { height: 12px; width: 12px; }
        .planner-scroll::-webkit-scrollbar-track { background: var(--bg-main); }
        .planner-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 6px; border: 3px solid var(--bg-main); }
        .planner-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="dark">

    <div id="app-wrapper" class="flex flex-col h-screen w-full">
        <header class="bg-slate-900 border-b border-slate-700 px-6 py-4 flex justify-between items-center shrink-0">
            <div class="flex items-center gap-6">
                <h1 class="text-2xl font-black uppercase tracking-widest">FTS<span class="text-green-500">Performance</span></h1>
                <div class="hidden sm:flex items-center gap-2 bg-slate-800 p-1.5 rounded-lg border border-slate-700">
                    <span class="px-5 py-2 rounded-md text-xs font-black uppercase tracking-widest text-slate-300">Driver Bonus Scheme</span>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="hidden md:flex gap-6 text-[11px] font-bold uppercase tracking-widest bg-slate-800 p-2.5 px-5 rounded-lg border border-slate-700">
                    <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span> Target Met / Logged</div>
                    <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]"></span> Target Failed</div>
                    <div class="flex items-center gap-2"><span class="w-4 h-4 rounded bg-slate-600 shadow-inner"></span> Exempt / None</div>
                </div>
            </div>
        </header>

        <main class="flex-grow p-4 md:p-6 overflow-hidden flex flex-col">
            <div id="dashboard-container" class="glass-card h-full w-full">
                <!-- Grid injects here -->
            </div>
        </main>
    </div>

    <script>
        const SB_URL = 'https://mbudwnwxucluwgbkgbfx.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1idWR3bnd4dWNsdXdnYmtnYmZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUyMDQwMjYsImV4cCI6MjA5MDc4MDAyNn0.xFv-FiQ894vdfJuQYWQyF4WzQXmlnmnKvz_c8nuzl5Q'; 
        const supabaseClient = window.supabase.createClient(SB_URL, SB_KEY);

        // Updated criteria: Replaced Clean Cab with Fuel Logs
        const bonusCriteria = [
            { key: 'shift_logging', label: 'Shift Logging' },
            { key: 'daily_checks', label: 'Daily Vehicle Checks' },
            { key: 'daily_trailer_checks', label: 'Daily Trailer Checks' },
            { key: 'fuel_logs', label: 'Fuel Logs' },
            { key: 'on_time_delivery', label: 'On-Time Drops' },
            { key: 'no_incidents', label: 'Accident Free' }
        ];

        async function loadDriverData() {
            try {
                const now = new Date();
                const dayOfWeek = now.getDay() || 7; 
                const startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - dayOfWeek + 1);
                startOfWeek.setHours(0, 0, 0, 0); 
                const startIso = startOfWeek.toISOString();

                // Fetch from ALL FOUR tables simultaneously
                const [logsResponse, vehicleChecksResponse, trailerChecksResponse, fuelLogsResponse] = await Promise.all([
                    supabaseClient.from('fleet_logs').select('driver_name, created_at, action_type').gte('created_at', startIso),
                    supabaseClient.from('daily_vehicle_checks').select('driver_name, created_at').gte('created_at', startIso),
                    supabaseClient.from('daily_trailer_checks').select('driver_name, created_at').gte('created_at', startIso),
                    supabaseClient.from('fuel_logs').select('driver_name, created_at').gte('created_at', startIso)
                ]);
                
                if (logsResponse.error) console.error("Fleet Logs fetch error:", logsResponse.error);
                if (vehicleChecksResponse.error) console.error("Vehicle Checks fetch error:", vehicleChecksResponse.error);
                if (trailerChecksResponse.error) console.error("Trailer Checks fetch error:", trailerChecksResponse.error);
                if (fuelLogsResponse.error) console.error("Fuel Logs fetch error:", fuelLogsResponse.error);

                const logs = logsResponse.data || [];
                const vehicleChecks = vehicleChecksResponse.data || [];
                const trailerChecks = trailerChecksResponse.data || [];
                const fuelLogs = fuelLogsResponse.data || [];

                const driverDataMap = {};

                const initDriver = (dName) => {
                    if (!dName) return;
                    if (!driverDataMap[dName]) {
                        driverDataMap[dName] = {
                            driver_name: dName,
                            shifts: {
                                1: { start: false, end: false }, 2: { start: false, end: false },
                                3: { start: false, end: false }, 4: { start: false, end: false },
                                5: { start: false, end: false }
                            },
                            dailyChecks: { 1: false, 2: false, 3: false, 4: false, 5: false },
                            dailyTrailerChecks: { 1: false, 2: false, 3: false, 4: false, 5: false },
                            fuelLogsCount: 0 // Set initial fuel counter to zero
                        };
                    }
                };

                // 1. Process Fleet Logs
                logs.forEach(log => {
                    initDriver(log.driver_name);
                    const logDate = new Date(log.created_at);
                    const logDay = logDate.getDay(); 

                    if (logDay >= 1 && logDay <= 5) {
                        if (log.action_type === 'START') {
                            driverDataMap[log.driver_name].shifts[logDay].start = true;
                        } else if (log.action_type === 'END') {
                            driverDataMap[log.driver_name].shifts[logDay].end = true;
                        }
                    }
                });

                // 2. Process Vehicle Checks
                vehicleChecks.forEach(check => {
                    initDriver(check.driver_name);
                    const checkDate = new Date(check.created_at);
                    const checkDay = checkDate.getDay();

                    if (checkDay >= 1 && checkDay <= 5) {
                        driverDataMap[check.driver_name].dailyChecks[checkDay] = true;
                    }
                });

                // 3. Process Trailer Checks
                trailerChecks.forEach(check => {
                    initDriver(check.driver_name);
                    const checkDate = new Date(check.created_at);
                    const checkDay = checkDate.getDay();

                    if (checkDay >= 1 && checkDay <= 5) {
                        driverDataMap[check.driver_name].dailyTrailerChecks[checkDay] = true;
                    }
                });

                // 4. Process Fuel Logs
                fuelLogs.forEach(log => {
                    initDriver(log.driver_name);
                    // Every time their name appears this week, we add 1 to their counter
                    driverDataMap[log.driver_name].fuelLogsCount++;
                });

                const driverObjects = Object.values(driverDataMap).sort((a, b) => a.driver_name.localeCompare(b.driver_name));
                renderDashboard(driverObjects);

            } catch (err) { 
                console.error("Load Error:", err); 
            }
        }

        function renderDashboard(drivers) {
            const container = document.getElementById('dashboard-container'); 
            
            if (drivers.length === 0) {
                container.innerHTML = `<div class="flex items-center justify-center h-full text-slate-400 font-bold tracking-widest uppercase">No driver logs found for the current week.</div>`;
                return;
            }
            
            let html = `
                <div class="planner-scroll">
                    <table class="w-full border-collapse text-sm">
                        <thead>
                            <tr>
                                <th class="p-4 border-b border-r border-slate-700 bg-slate-900 text-left sticky left-0 z-20 text-white font-black uppercase tracking-widest min-w-[200px] shadow-[2px_0_5px_rgba(0,0,0,0.2)]">
                                    <span class="text-green-500">DRIVER</span> NAME
                                </th>
                                ${bonusCriteria.map(c => `
                                    <th class="p-4 border-b border-r border-slate-700 bg-slate-800 text-center font-bold text-slate-300 min-w-[120px] uppercase tracking-wider text-xs sticky top-0 z-10">
                                        ${c.label}
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;

            const dayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
            const noTrailerDrivers = ['darren brown', 'callum west', 'callum lee'];

            drivers.forEach((driver, index) => {
                const bgClass = index % 2 === 0 ? 'bg-transparent' : 'bg-slate-800/30';
                const isTrailerExempt = noTrailerDrivers.includes(driver.driver_name.toLowerCase().trim());

                html += `<tr class="${bgClass} hover:bg-slate-700/50 transition-colors">`;
                html += `<td class="p-4 border-r border-b border-slate-700 bg-slate-900 sticky left-0 z-10 font-bold text-white shadow-[2px_0_5px_rgba(0,0,0,0.2)] tracking-wide">${driver.driver_name}</td>`;
                
                bonusCriteria.forEach(criteria => {
                    
                    if (criteria.key === 'shift_logging') {
                        let startRowHtml = '';
                        let endRowHtml = '';

                        for (let d = 1; d <= 5; d++) {
                            const dayData = driver.shifts[d];
                            const startColor = dayData.start ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]';
                            const endColor = dayData.end ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]';
                            
                            startRowHtml += `<div class="w-3 h-3 rounded-sm ${startColor}" title="${dayNames[d-1]} Clock In"></div>`;
                            endRowHtml += `<div class="w-3 h-3 rounded-sm ${endColor}" title="${dayNames[d-1]} Clock Out"></div>`;
                        }

                        html += `
                            <td class="p-2 border-r border-b border-slate-700 text-center h-14 align-middle min-w-[130px]">
                                <div class="flex flex-col gap-1 items-center justify-center">
                                    <div class="flex gap-1">${startRowHtml}</div>
                                    <div class="flex gap-1">${endRowHtml}</div>
                                </div>
                            </td>
                        `;
                    } else if (criteria.key === 'daily_checks') {
                        let checksRowHtml = '';

                        for (let d = 1; d <= 5; d++) {
                            const hasChecked = driver.dailyChecks[d];
                            const checkColor = hasChecked ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]';
                            
                            checksRowHtml += `<div class="w-3 h-3 rounded-sm ${checkColor}" title="${dayNames[d-1]} Vehicle Check"></div>`;
                        }

                        html += `
                            <td class="p-2 border-r border-b border-slate-700 text-center h-14 align-middle min-w-[130px]">
                                <div class="flex gap-1 items-center justify-center">
                                    ${checksRowHtml}
                                </div>
                            </td>
                        `;
                    } else if (criteria.key === 'daily_trailer_checks') {
                        let trailerChecksRowHtml = '';

                        for (let d = 1; d <= 5; d++) {
                            if (isTrailerExempt) {
                                trailerChecksRowHtml += `<div class="w-3 h-3 rounded-sm bg-slate-600 shadow-inner cursor-not-allowed" title="${dayNames[d-1]}: N/A (No Trailer)"></div>`;
                            } else {
                                const hasChecked = driver.dailyTrailerChecks[d];
                                const checkColor = hasChecked ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]' : 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.6)]';
                                
                                trailerChecksRowHtml += `<div class="w-3 h-3 rounded-sm ${checkColor}" title="${dayNames[d-1]} Trailer Check"></div>`;
                            }
                        }

                        html += `
                            <td class="p-2 border-r border-b border-slate-700 text-center h-14 align-middle min-w-[130px]">
                                <div class="flex gap-1 items-center justify-center">
                                    ${trailerChecksRowHtml}
                                </div>
                            </td>
                        `;
                    } else if (criteria.key === 'fuel_logs') {
                        // NEW LOGIC FOR DYNAMIC FUEL LOGS
                        let fuelHtml = '';
                        const fuelCount = driver.fuelLogsCount;

                        if (fuelCount > 0) {
                            // Print a green square for every single fuel up recorded
                            for (let i = 0; i < fuelCount; i++) {
                                fuelHtml += `<div class="w-3 h-3 rounded-sm bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]" title="Fuel Up Logged"></div>`;
                            }
                        } else {
                            // If they have 0, show a single grey placeholder
                            fuelHtml = `<div class="w-3 h-3 rounded-sm bg-slate-600 shadow-inner" title="0 Fuel Ups This Week"></div>`;
                        }

                        // Added 'flex-wrap' just in case someone fuels up 10 times, the squares will wrap to the next line neatly!
                        html += `
                            <td class="p-2 border-r border-b border-slate-700 text-center h-14 align-middle min-w-[130px]">
                                <div class="flex gap-1 flex-wrap items-center justify-center max-w-[100px] mx-auto">
                                    ${fuelHtml}
                                </div>
                            </td>
                        `;
                    } else {
                        html += `
                            <td class="p-2 border-r border-b border-slate-700 text-center h-14 align-middle">
                                <div class="flex justify-center">
                                    <div class="w-5 h-5 rounded-sm bg-slate-600 shadow-inner" title="Data pending"></div>
                                </div>
                            </td>
                        `;
                    }
                });
                
                html += `</tr>`;
            });

            html += `</tbody></table></div>`;
            container.innerHTML = html;
        }

        window.onload = () => { 
            loadDriverData(); 
            setInterval(loadDriverData, 300000); 
        };
    </script>
</body>
</html>
